<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AeroFlow AI - 3D Fluid Overlay</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    
    #cesiumContainer {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0; z-index: 1;
    }

    #fluidCanvas {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0; z-index: 2;
      pointer-events: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <canvas id="fluidCanvas"></canvas>

  <script src="fluid.js"></script>
  <script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayerPicker: false,
      timeline: false,
      animation: false
    });
  </script>
</body>
</html>
