<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AeroFlow AI | Wind Visualization</title>

    <!-- Cesium 로컬 라이브러리 경로 -->
    <script>
        window.CESIUM_BASE_URL = "./public/cesium/";
    </script>

    <link
        rel="stylesheet"
        href="./public/cesium/Widgets/widgets.css"
    >

    <script src="./public/cesium/Cesium.js"></script>

    <!-- React UI -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide 아이콘 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: #07111f;
            color: #e5eefb;
        }

        /* Cesium 지도 */
        #cesiumContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 바람 입자 캔버스 */
        #fluidCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: transparent;
        }

        /* 제어 패널 */
        #root {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: min(360px, calc(100vw - 32px));
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .panel {
            padding: 22px;
            border: 1px solid rgba(125, 177, 255, 0.25);
            border-radius: 18px;
            background: rgba(8, 19, 37, 0.93);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        .panel-title {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f1f7ff;
        }

        .panel-subtitle {
            margin-top: 6px;
            font-size: 12px;
            color: #8da7c8;
        }

        .section {
            margin-top: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #c8d9ef;
        }

        .value-label {
            font-size: 13px;
            font-weight: 700;
            color: #62c5ff;
        }

        .direction-dial {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border: 1px solid rgba(110, 171, 255, 0.3);
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(33, 67, 109, 0.45),
                    rgba(10, 26, 48, 0.8)
                );
        }

        .dial-ring {
            position: absolute;
            inset: 15px;
            border: 1px dashed rgba(126, 176, 236, 0.35);
            border-radius: 50%;
        }

        .direction-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 48px;
            border-radius: 5px;
            background: #54c8ff;
            box-shadow: 0 0 14px rgba(84, 200, 255, 0.6);
            transform-origin: 50% 100%;
        }

        .direction-arrow::before {
            content: "";
            position: absolute;
            top: -7px;
            left: -6px;
            width: 0;
            height: 0;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #54c8ff;
            border-left: 8px solid transparent;
        }

        .dial-center {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e9f7ff;
            box-shadow: 0 0 10px #54c8ff;
        }

        .dial-label {
            position: absolute;
            font-size: 10px;
            font-weight: 700;
            color: #8da7c8;
        }

        .dial-n {
            top: 7px;
            left: 50%;
            transform: translateX(-50%);
        }

        .dial-e {
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
        }

        .dial-s {
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
        }

        .dial-w {
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
        }

        input[type="range"] {
            width: 100%;
            accent-color: #42bdf5;
            cursor: pointer;
        }

        .range-limits {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 11px;
            color: #7892b3;
        }

        .speed-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding: 14px;
            border: 1px solid rgba(125, 177, 255, 0.17);
            border-radius: 12px;
            background: rgba(28, 49, 76, 0.5);
        }

        .speed-number {
            font-size: 24px;
            font-weight: 800;
            color: #61caff;
        }

        .speed-unit {
            margin-left: 5px;
            font-size: 11px;
            color: #8da7c8;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 11px 12px;
            border-radius: 10px;
            background: rgba(28, 49, 76, 0.45);
            font-size: 12px;
            color: #b9cce3;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #fbbf24;
        }

        .status-dot.ready {
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-button {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-button {
            border: 1px solid rgba(130, 170, 220, 0.25);
            background: rgba(30, 51, 78, 0.7);
            color: #c9d9ed;
        }

        .reset-button:hover {
            background: rgba(45, 73, 107, 0.9);
        }

        .apply-button {
            background: linear-gradient(135deg, #087eb8, #2563eb);
            color: white;
            box-shadow: 0 5px 16px rgba(37, 99, 235, 0.25);
        }

        .apply-button:hover {
            filter: brightness(1.15);
        }

        .footnote {
            margin-top: 15px;
            font-size: 10px;
            line-height: 1.6;
            color: #7892b3;
        }

        @media (max-width: 600px) {
            #root {
                top: 10px;
                right: 10px;
                width: min(330px, calc(100vw - 20px));
                max-height: calc(100vh - 20px);
            }

            .panel {
                padding: 17px;
            }

            .direction-dial {
                width: 125px;
                height: 125px;
            }
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>
    <canvas id="fluidCanvas"></canvas>
    <div id="root"></div>

    <!-- 바람 시각화 코드 -->
    <script src="./fluid.js"></script>

    <!-- Cesium Viewer 생성 -->
    <script>
        let viewer;

        try {
            viewer = new Cesium.Viewer("cesiumContainer", {
                baseLayerPicker: false,
                timeline: false,
                animation: false,
                geocoder: false,
                homeButton: true,
                sceneModePicker: false,
                navigationHelpButton: false,
                infoBox: false,
                selectionIndicator: false,
                imageryProvider: new Cesium.TileMapServiceImageryProvider({
                    url: Cesium.buildModuleUrl(
                        "Assets/Textures/NaturalEarthII"
                    )
                })
            });

            window.viewer = viewer;

            viewer.scene.globe.show = true;
            viewer.scene.globe.enableLighting = true;

            // 인천공항 주변을 기본 시점으로 설정
            viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(
                    126.45,
                    37.46,
                    12000
                )
            });

            console.log("[AeroFlow AI] Cesium Viewer 준비 완료");
        } catch (error) {
            console.error(
                "[AeroFlow AI] Cesium 초기화 실패:",
                error
            );
        }
    </script>

    <!-- 제어 패널 -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function getDirectionText(degrees) {
            const directions = [
                "북풍",
                "북동풍",
                "동풍",
                "남동풍",
                "남풍",
                "남서풍",
                "서풍",
                "북서풍"
            ];

            const index = Math.round(
                (degrees % 360) / 45
            ) % 8;

            return directions[index];
        }

        function WeatherControlPanel() {
            const [windDirection, setWindDirection] = useState(180);
            const [windSpeed, setWindSpeed] = useState(10);
            const [status, setStatus] = useState(
                "바람 데이터 불러오는 중"
            );
            const [dataReady, setDataReady] = useState(false);

            useEffect(() => {
                const checkData = () => {
                    if (
                        typeof window.setFluidWind === "function"
                    ) {
                        setDataReady(true);
                        setStatus("바람 제어 준비 완료");
                    }
                };

                checkData();

                const timer = setInterval(checkData, 500);

                return () => clearInterval(timer);
            }, []);

            const handleReset = () => {
                setWindDirection(180);
                setWindSpeed(10);

                if (typeof window.setFluidWind === "function") {
                    window.setFluidWind(180, 10);
                }

                setStatus("기본 풍향·풍속으로 초기화");
            };

            const handleApply = () => {
                if (
                    typeof window.setFluidWind !== "function"
                ) {
                    setStatus(
                        "시각화 모듈을 확인해 주세요"
                    );
                    return;
                }

                window.setFluidWind(
                    windDirection,
                    windSpeed
                );

                setStatus(
                    `${getDirectionText(windDirection)} 적용 완료`
                );
            };

            return (
                <div className="panel">
                    <header>
                        <h1 className="panel-title">
                            AEROFLOW AI
                        </h1>

                        <p className="panel-subtitle">
                            Aircraft Wind Visualization System
                        </p>
                    </header>

                    <section className="section">
                        <div className="section-header">
                            <span className="section-label">
                                WIND DIRECTION
                            </span>

                            <span className="value-label">
                                {windDirection}°
                            </span>
                        </div>

                        <div className="direction-dial">
                            <div className="dial-ring"></div>

                            <span className="dial-label dial-n">N</span>
                            <span className="dial-label dial-e">E</span>
                            <span className="dial-label dial-s">S</span>
                            <span className="dial-label dial-w">W</span>

                            <div
                                className="direction-arrow"
                                style={{
                                    transform:
                                        `translate(-50%, -100%) rotate(${windDirection}deg)`
                                }}
                            ></div>

                            <div className="dial-center"></div>
                        </div>

                        <div className="section-header">
                            <span className="section-label">
                                풍향 설정
                            </span>

                            <span className="value-label">
                                {getDirectionText(windDirection)}
                            </span>
                        </div>

                        <input
                            type="range"
                            min="0"
                            max="359"
                            step="1"
                            value={windDirection}
                            onChange={(event) =>
                                setWindDirection(
                                    Number(event.target.value)
                                )
                            }
                        />

                        <div className="range-limits">
                            <span>0° 북풍</span>
                            <span>180° 남풍</span>
                            <span>359°</span>
                        </div>
                    </section>

                    <section className="section">
                        <div className="section-header">
                            <span className="section-label">
                                WIND SPEED
                            </span>

                            <span className="value-label">
                                {windSpeed} m/s
                            </span>
                        </div>

                        <input
                            type="range"
                            min="0"
                            max="100"
                            step="1"
                            value={windSpeed}
                            onChange={(event) =>
                                setWindSpeed(
                                    Number(event.target.value)
                                )
                            }
                        />

                        <div className="range-limits">
                            <span>0 m/s</span>
                            <span>50 m/s</span>
                            <span>100 m/s</span>
                        </div>

                        <div className="speed-card">
                            <div>
                                <div className="section-label">
                                    현재 설정 풍속
                                </div>

                                <div className="panel-subtitle">
                                    사용자 지정 값
                                </div>
                            </div>

                            <div>
                                <span className="speed-number">
                                    {windSpeed}
                                </span>

                                <span className="speed-unit">
                                    m/s
                                </span>
                            </div>
                        </div>
                    </section>

                    <div className="status-row">
                        <span
                            className={
                                dataReady
                                    ? "status-dot ready"
                                    : "status-dot"
                            }
                        ></span>

                        <span>{status}</span>
                    </div>

                    <div className="button-row">
                        <button
                            className="action-button reset-button"
                            onClick={handleReset}
                        >
                            초기화
                        </button>

                        <button
                            className="action-button apply-button"
                            onClick={handleApply}
                        >
                            바람 적용
                        </button>
                    </div>

                    <p className="footnote">
                        시각화는 로컬 바람 데이터와 사용자가 설정한
                        풍향·풍속을 기반으로 작동합니다.
                        현재 효과는 시연용이며 실제 비행 안전 판단에
                        사용할 수 없습니다.
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<WeatherControlPanel />);
    </script>
</body>
</html>
